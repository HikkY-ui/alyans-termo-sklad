<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Альянс Термо — ППС</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ППС">
<style>
  :root {
    --black: #111111;
    --white: #ffffff;
    --red: #E31E24;
    --gray-bg: #F4F4F4;
    --gray-border: #E0E0E0;
    --gray-text: #8A8A8A;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--white);
    color: var(--black);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    background: var(--white);
  }

  header {
    padding: 3px 14px 3px;
    border-bottom: 2px solid var(--black);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .brand { font-weight: 800; font-size: 11px; letter-spacing: 0.5px; flex-shrink: 0; }
  .brand span { color: var(--red); }
  .table-label {
    font-size: 12px;
    font-weight: 800;
    color: var(--black);
    text-align: center;
    flex: 1;
  }
  .date-pill {
    font-size: 10px;
    font-weight: 700;
    color: var(--red);
    border: 2px solid var(--red);
    border-radius: 20px;
    padding: 1px 8px;
    flex-shrink: 0;
  }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .screen { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .screen.active { display: flex; }

  #screenAdd { padding: 6px 10px 6px; gap: 5px; }

  /* ===== Grid table ===== */
  .grid-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .data-table {
    width: 100%;
    height: 100%;
    border-collapse: collapse;
    border: 2px solid var(--red);
    border-radius: 6px;
    overflow: hidden;
    font-size: 17px;
    table-layout: fixed;
  }
  .data-table thead th {
    background: var(--black);
    color: var(--white);
    padding: 6px 1px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.25);
  }
  .data-table thead th:last-child { border-right: none; }
  .data-table tbody th {
    background: var(--gray-bg);
    color: var(--black);
    padding: 6px 3px;
    font-size: 13px;
    font-weight: 800;
    text-align: left;
    border-right: 1px solid var(--gray-border);
    border-bottom: 1px solid var(--gray-border);
  }
  .data-table tbody td {
    padding: 2px;
    text-align: center;
    border-bottom: 1px solid var(--gray-border);
    border-right: 1px solid var(--gray-border);
    color: var(--black);
    font-weight: 700;
  }
  .data-table tbody td:last-child { border-right: none; }
  .data-table tbody td.selected { background: var(--red); color: var(--white); font-weight: 800; }

  /* ===== Количество field ===== */
  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.8px;
    color: var(--gray-text);
    text-transform: uppercase;
    margin: 0 0 3px 2px;
  }
  .field-display {
    width: 100%;
    border: 2px solid var(--gray-border);
    border-radius: 12px;
    padding: 6px;
    font-size: 18px;
    font-weight: 800;
    text-align: center;
    background: var(--gray-bg);
    color: var(--gray-text);
  }
  .field-display.filled { color: var(--black); background: var(--white); border-color: var(--black); }
  .field-display.active { border-color: var(--red); background: var(--white); color: var(--red); }
  .field-display.filled.active { color: var(--red); }

  /* ===== Keypad (9 digits + Добавить/0/⌫ row) ===== */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: min-content;
    gap: 5px;
    width: 100%;
  }
  .key {
    border: 2px solid var(--gray-border);
    border-radius: 11px;
    background: var(--gray-bg);
    font-size: 16px;
    font-weight: 700;
    color: var(--black);
    padding: 10px 0;
    width: 100%;
  }
  .key:active { background: var(--gray-border); }
  .key.add-key {
    background: #1FA24A;
    color: var(--white);
    border-color: #1FA24A;
    font-size: 22px;
  }
  .key.add-key:disabled { background: var(--gray-border); color: var(--gray-text); border-color: var(--gray-border); }

  .btn-row { display: flex; gap: 8px; }
  .action-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: var(--white);
    color: var(--red);
    border: 2px solid var(--red);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.3px;
  }
  .action-btn:disabled { border-color: var(--gray-border); color: var(--gray-border); }

  /* ===== Screen: Отчёт ===== */
  #screenReport { padding: 6px 10px 6px; gap: 4px; }
  .report-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
  .report-block { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .report-block-label {
    font-size: 9px;
    font-weight: 800;
    color: var(--red);
    margin: 0 0 1px 2px;
    flex-shrink: 0;
  }
  .report-table { width: 100%; flex: 1; min-height: 0; border-collapse: collapse; border: 1.5px solid var(--red); border-radius: 4px; overflow: hidden; font-size: 8px; table-layout: fixed; }
  .report-table th {
    background: var(--black);
    color: var(--white);
    padding: 1px;
    font-size: 7px;
    font-weight: 700;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.2);
  }
  .report-table th:last-child { border-right: none; }
  .report-table tbody th {
    background: var(--gray-bg);
    color: var(--black);
    text-align: left;
    padding: 1px 2px;
    border-right: 1px solid var(--gray-border);
    border-bottom: 1px solid var(--gray-border);
  }
  .report-table td {
    text-align: center;
    color: var(--black);
    font-weight: 700;
    border-bottom: 1px solid var(--gray-border);
    border-right: 1px solid var(--gray-border);
  }
  .report-table td:last-child { border-right: none; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--black);
    color: var(--white);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">А<span>Т</span></div>
    <div class="table-label" id="tableLabel">Пачки</div>
    <div class="date-pill" id="dateLabel">--.--.----</div>
  </header>

  <main>
    <!-- ===== Screen: Добавить (reused for all 4 tables) ===== -->
    <div class="screen active" id="screenAdd">
      <div class="grid-wrap" id="gridWrap">
        <div style="text-align:center;color:var(--gray-text);font-size:12px;padding:20px 0;">Загрузка...</div>
      </div>

      <div>
        <div class="section-label">Значение</div>
        <div class="field-display" id="valDisplay">0</div>
      </div>

      <div class="keypad" id="keypad"></div>

      <div class="btn-row">
        <button class="action-btn" id="clearAllBtn">ОЧИСТИТЬ ВСЕ</button>
        <button class="action-btn" id="deleteBtn" disabled>УДАЛИТЬ</button>
      </div>
    </div>

    <!-- ===== Screen: Отчёт ===== -->
    <div class="screen" id="screenReport">
      <div class="report-wrap" id="reportWrap">
        <div style="text-align:center;color:var(--gray-text);font-size:12px;padding:20px 0;">Загрузка...</div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  // ==================== CONFIG ====================
  const API_URL = "https://script.google.com/macros/s/AKfycbxyCUYYc6XiR5M5nsoqeJn0IjmKWlJVRqZGAREsVHckGy1WPiGxwg41_qRcNipOZaaUTg/exec";
  const TABLES = [
    { id: "пачки", label: "Пачки" },
    { id: "2000", label: "2000" },
    { id: "3000", label: "3000" },
    { id: "4000", label: "4000" }
  ];

  // ==================== STATE ====================
  let ROWS = [];
  let COLS = [];
  let dataByTable = {}; // { tableId: { rowLabel: { colLabel: value } } }
  let currentTableIndex = 0;
  let currentView = "add"; // "add" | "report"
  let selectedRow = null;
  let selectedCol = null;
  let valStr = "";

  // ==================== DATE ====================
  function formatDate(d) {
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const yyyy = d.getFullYear();
    return `${dd}.${mm}.${yyyy}`;
  }
  document.getElementById("dateLabel").textContent = formatDate(new Date());

  // ==================== LOAD ALL DATA ====================
  async function loadAllData() {
    try {
      const res = await fetch(`${API_URL}?action=getAllData`);
      const data = await res.json();
      ROWS = data.rows;
      COLS = data.cols;
      dataByTable = data.tables;
      if (currentView === "add") renderGrid();
      else renderReport();
    } catch (err) {
      document.getElementById("gridWrap").innerHTML =
        '<div style="text-align:center;color:var(--gray-text);font-size:12px;padding:20px 0;">Не удалось загрузить таблицу</div>';
    }
  }

  // ==================== ADD SCREEN: RENDER GRID ====================
  function currentTable() { return TABLES[currentTableIndex]; }

  function renderGrid() {
    const t = currentTable();
    document.getElementById("tableLabel").textContent = t.label;
    const values = dataByTable[t.id] || {};

    let html = '<table class="data-table"><thead><tr><th></th>';
    COLS.forEach(c => html += `<th>${c}</th>`);
    html += '</tr></thead><tbody>';
    ROWS.forEach(r => {
      html += `<tr><th>${r}</th>`;
      COLS.forEach(c => {
        const v = (values[r] || {})[c];
        const isSel = (r === selectedRow && c === selectedCol);
        html += `<td class="${isSel ? 'selected' : ''}" data-row="${r}" data-col="${c}">${v === "" || v === undefined ? "" : v}</td>`;
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    document.getElementById("gridWrap").innerHTML = html;

    document.querySelectorAll(".data-table tbody td").forEach(td => {
      td.onclick = () => selectCell(td.dataset.row, td.dataset.col);
    });
  }

  function selectCell(row, col) {
    selectedRow = row;
    selectedCol = col;
    valStr = "";
    renderVal();
    renderGrid();
    updateBtnState();
  }

  function renderVal() {
    const el = document.getElementById("valDisplay");
    el.textContent = valStr === "" ? "0" : valStr;
    el.classList.toggle("filled", valStr !== "");
    el.classList.toggle("active", selectedRow !== null);
  }

  // ==================== KEYPAD ====================
  // Layout: 1-9 as usual, bottom row is [Добавить, 0, ⌫] — no "C".
  const keypad = document.getElementById("keypad");
  const digitKeys = ["1","2","3","4","5","6","7","8","9"];
  digitKeys.forEach(k => {
    const btn = document.createElement("button");
    btn.className = "key";
    btn.textContent = k;
    btn.onclick = () => handleDigit(k);
    keypad.appendChild(btn);
  });

  const addKeyBtn = document.createElement("button");
  addKeyBtn.className = "key add-key";
  addKeyBtn.id = "addBtn";
  addKeyBtn.textContent = "✓";
  addKeyBtn.disabled = true;
  keypad.appendChild(addKeyBtn);

  const zeroBtn = document.createElement("button");
  zeroBtn.className = "key";
  zeroBtn.textContent = "0";
  zeroBtn.onclick = () => handleDigit("0");
  keypad.appendChild(zeroBtn);

  const backBtn = document.createElement("button");
  backBtn.className = "key";
  backBtn.textContent = "⌫";
  backBtn.onclick = () => {
    if (selectedRow === null) { showToast("Сначала выберите ячейку в таблице"); return; }
    valStr = valStr.slice(0, -1);
    renderVal();
    updateBtnState();
  };
  keypad.appendChild(backBtn);

  function handleDigit(k) {
    if (selectedRow === null) { showToast("Сначала выберите ячейку в таблице"); return; }
    if (valStr.length < 6) valStr += k;
    renderVal();
    updateBtnState();
  }

  function updateBtnState() {
    const cellChosen = selectedRow !== null && selectedCol !== null;
    document.getElementById("addBtn").disabled = !(cellChosen && valStr !== "");
    document.getElementById("deleteBtn").disabled = !cellChosen;
  }

  // ==================== ADD (replace value) ====================
  document.getElementById("addBtn").onclick = () => {
    if (selectedRow === null || valStr === "") return;
    const t = currentTable();
    const r = selectedRow, c = selectedCol, v = valStr;
    showToast(`${t.label} · ${r}, ${c}: ${v}`);
    if (!dataByTable[t.id][r]) dataByTable[t.id][r] = {};
    dataByTable[t.id][r][c] = Number(v);
    valStr = "";
    renderVal();
    renderGrid();
    updateBtnState();
    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "setCell", table: t.id, row: r, col: c, value: v })
    }).then(res => res.json()).then(data => {
      if (!data.success) showToast("Не сохранилось на сервере — попробуйте снова");
    }).catch(() => showToast("Ошибка сети — не сохранено"));
  };

  // ==================== DELETE (clear cell) ====================
  document.getElementById("deleteBtn").onclick = () => {
    if (selectedRow === null) return;
    const t = currentTable();
    const r = selectedRow, c = selectedCol;
    showToast(`Очищено: ${t.label} · ${r}, ${c}`);
    dataByTable[t.id][r][c] = "";
    valStr = "";
    renderVal();
    renderGrid();
    updateBtnState();
    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "deleteCell", table: t.id, row: r, col: c })
    }).then(res => res.json()).then(data => {
      if (!data.success) showToast("Не удалось очистить на сервере");
    }).catch(() => showToast("Ошибка сети"));
  };

  // ==================== CLEAR ALL (current table, with confirmation) ====================
  document.getElementById("clearAllBtn").onclick = () => {
    const t = currentTable();
    const ok = confirm(`Точно очистить всю таблицу «${t.label}»? Это действие нельзя отменить.`);
    if (!ok) return;
    ROWS.forEach(r => { COLS.forEach(c => { if (!dataByTable[t.id][r]) dataByTable[t.id][r] = {}; dataByTable[t.id][r][c] = ""; }); });
    selectedRow = null; selectedCol = null; valStr = "";
    renderVal();
    renderGrid();
    updateBtnState();
    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "clearAll", table: t.id })
    }).then(res => res.json()).then(data => {
      if (data.success) showToast(`Таблица «${t.label}» очищена`);
      else showToast("Не удалось очистить на сервере");
    }).catch(() => showToast("Ошибка сети"));
  };

  // ==================== REPORT SCREEN ====================
  function renderReport() {
    const wrap = document.getElementById("reportWrap");
    let html = "";
    TABLES.forEach(t => {
      const values = dataByTable[t.id] || {};
      html += `<div class="report-block"><div class="report-block-label">${t.label}</div>`;
      html += '<table class="report-table"><thead><tr><th></th>';
      COLS.forEach(c => html += `<th>${c}</th>`);
      html += '</tr></thead><tbody>';
      ROWS.forEach(r => {
        html += `<tr><th>${r.replace("ппс ", "")}</th>`;
        COLS.forEach(c => {
          const v = (values[r] || {})[c];
          html += `<td>${v === "" || v === undefined ? "" : v}</td>`;
        });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    });
    wrap.innerHTML = html;
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
  }

  // ==================== NAVIGATION: vertical swipe = switch table, horizontal swipe = Добавить <-> Отчёт ====================
  function showAddScreen() {
    currentView = "add";
    document.getElementById("screenAdd").classList.add("active");
    document.getElementById("screenReport").classList.remove("active");
    selectedRow = null; selectedCol = null; valStr = "";
    renderVal();
    renderGrid();
    updateBtnState();
  }
  function showReportScreen() {
    currentView = "report";
    document.getElementById("tableLabel").textContent = "Отчёт";
    document.getElementById("screenReport").classList.add("active");
    document.getElementById("screenAdd").classList.remove("active");
    renderReport();
  }

  let touchStartX = 0, touchStartY = 0;
  document.getElementById("app").addEventListener("touchstart", (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  document.getElementById("app").addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 55 && Math.abs(dy) < 55) return;

    if (Math.abs(dx) > Math.abs(dy)) {
      // horizontal swipe
      if (dx < 0 && currentView === "add") showReportScreen();       // swipe left: Добавить -> Отчёт
      else if (dx > 0 && currentView === "report") showAddScreen();  // swipe right: Отчёт -> Добавить
    } else {
      // vertical swipe — only cycles tables while on the Добавить screen
      if (currentView !== "add") return;
      if (dy < 0 && currentTableIndex < TABLES.length - 1) { currentTableIndex++; showAddScreen(); }
      else if (dy > 0 && currentTableIndex > 0) { currentTableIndex--; showAddScreen(); }
    }
  }, { passive: true });

  // ==================== DISABLE PINCH / DOUBLE-TAP ZOOM ====================
  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("gesturechange", e => e.preventDefault());
  document.addEventListener("gestureend", e => e.preventDefault());
  let lastTouchEnd = 0;
  document.addEventListener("touchend", e => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  // ==================== INIT ====================
  loadAllData();

  // ==================== SERVICE WORKER (PWA installability) ====================
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
